# CI/CD pipeline orchestrator — the single entry point. Every stage is a reusable
# workflow (a job-level module). GitHub requires reusable workflows to live in
# .github/workflows/ ("Subdirectories of the workflows directory are not
# supported"), so a .github/ci/ folder is not possible for them.
#
#   test (a) -> build (c) -> smoke (d) -> release (e) -> release image -> release smoke
#                                            ^ main only    ^ only if a release was cut
#
#   scan (b) is deferred (stubbed below)
#
# Triggers (on: push only; no pull_request — branch-push checks surface on the PR):
#   push to a non-default branch : test -> build -> smoke                    (sha)
#   push to main                 : the full chain above           (sha + latest [+ semver])
#
# Version tags do NOT trigger anything. release-please cuts the tag, and the
# release image is built from its `release_created` output — not from the tag
# push, which only fires when a GitHub App token pushed it.
name: CI

on:
  push:
    branches:
      - '**'
      - '!screen-enhance'
      - '!screen-enhance/**'

concurrency:
  group: ci-${{ github.ref }}
  # Superseded feature-branch runs are noise; cancel them. NEVER cancel on main —
  # a run cancelled between "release-please cut the tag" and "release image built"
  # leaves a published release with nothing in the registry behind it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # a — code testing.
  test:
    uses: ./.github/workflows/ci-test.yml

  # b — code scanning. DEFERRED (see the design doc). Left stubbed and NOT wired
  # in until the scanning approach (CodeQL + image scanning) is decided.
  # scan:
  #   uses: ./.github/workflows/ci-scan.yml

  # c — artifact building. Requires tests to have actually passed — `!= 'failure'`
  # would also let a SKIPPED test stage through, which is not the intent and reads
  # differently from every other gate here.
  build:
    needs: [test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml

  # d — artifact testing (smoke). Boots the freshly built image and asserts it serves.
  smoke:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-smoke.yml
    with:
      image: ${{ needs.build.outputs.image }}

  # e — release cutting. Main only, and only once the image for this commit has
  # been built and proven to boot, so a release is never cut on a commit whose
  # artifact is broken.
  release:
    needs: [smoke]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    # Pass only what the stage needs. `secrets: inherit` would hand the whole
    # repository secret store to the one job that already holds contents:write and
    # pull-requests:write.
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    uses: ./.github/workflows/ci-release.yml

  # Re-run stage c with the release tag so the image picks up its semver tags
  # (v7.1.5 / v7.1 / v7).
  #
  # `ref` pins the checkout to the tag rather than to this run's commit. Those are
  # not always the same: merging a release PR while an earlier main run is still in
  # its release job makes that older run cut the tag and then build its own,
  # staler checkout. v7.2.0 shipped that way, built from the docs commit.
  release-image:
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml
    with:
      version: ${{ needs.release.outputs.tag_name }}
      ref: ${{ needs.release.outputs.tag_name }}

  # Re-run stage d against the released image. A release image that doesn't boot
  # should surface here, not in someone's deployment.
  release-smoke:
    needs: [release-image]
    if: ${{ !cancelled() && needs.release-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-smoke.yml
    with:
      image: ${{ needs.release-image.outputs.image }}
