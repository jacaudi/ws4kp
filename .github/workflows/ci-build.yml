# Stage c — artifact building: multi-arch image to GHCR. Reusable workflow.
# Tag strategy (docker/metadata-action):
#   sha    — every build (feature branches, main, releases)
#   latest — default branch + releases
#   semver — releases only (v7.1.1 / v7.1 / v7), driven by the `version` input
# Outputs the pushed image by immutable digest so stage d can pull the exact build.
#
# `version` is how a release build gets its semver tags. release-please cuts the
# tag itself, so the release build is triggered by a push to main (not by the tag
# push) and github.ref is refs/heads/main — there is no semver ref to derive from.
# Passing the release tag explicitly is metadata-action's documented mechanism for
# that case. Left empty, every semver line falls back to the git ref, which is the
# pre-existing behaviour for ordinary branch and main builds.
#
# `ref` exists because `version` alone is not enough. The checkout would otherwise
# take the TRIGGERING run's sha, which is not necessarily the commit release-please
# tagged. If a release PR is merged while an earlier main run is still in its
# release job, that run cuts the tag on the new commit and then builds its own,
# older checkout — publishing a vX.Y.Z image whose package.json says something else.
# That happened to v7.2.0, which was built from the docs commit. A release build
# must pin the checkout to the tag it is stamping.
name: ci-build

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to derive semver image tags from (e.g. v7.1.5). Empty for non-release builds.
        required: false
        default: ''
        type: string
      ref:
        description: Git ref to build. Empty builds the triggering commit; a release build must pass its tag.
        required: false
        default: ''
        type: string
    outputs:
      image:
        description: Pushed image reference, pinned by digest
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # empty ref = the triggering commit, which is actions/checkout's default
          ref: ${{ inputs.ref }}
          lfs: true # fetch the real Git LFS assets (music) so they're baked in, not pointer files

      - name: Verify the checkout matches the release being stamped
        if: ${{ inputs.version != '' }}
        run: |
          set -euo pipefail
          want="${{ inputs.version }}"
          have="v$(node -p "require('./package.json').version")"
          echo "tag being stamped: ${want}"
          echo "package.json says: ${have}"
          # A release image whose package.json disagrees with its tag is the bug this
          # guard exists for — the app serves that version string to users.
          [ "${want}" = "${have}" ] || { echo "::error::refusing to publish ${want} from a checkout that reports ${have}"; exit 1; }

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/jacaudi/ws4kp
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,priority=1000,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{version}},value=${{ inputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern=v{{major}},value=${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Full SLSA provenance, so an image can be traced back to the repo, commit
          # and workflow run that produced it — the evidence that was missing when
          # v7.2.0 shipped built from the wrong commit.
          #
          # This is not a new manifest shape: BuildKit has attached provenance by
          # default (mode=min) since buildx 0.11, and the published index already
          # carries one attestation manifest per architecture (platform
          # unknown/unknown). mode=max enriches that existing attestation rather than
          # adding index entries. Safe here because the build passes no build-args and
          # no build secrets — mode=max would otherwise embed them.
          #
          # sbom is deliberately NOT enabled yet; an SBOM is only worth generating once
          # something consumes it, which is the deferred scanning decision.
          provenance: mode=max

      - name: Expose image reference (by digest)
        id: ref
        run: echo "image=ghcr.io/jacaudi/ws4kp@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
