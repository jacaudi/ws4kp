# Manual repair of a release image — retag (registry-side copy, preferred) or rebuild. Rationale: github-actions-align/templates/README.md#release-republishyml
#
# The normal path publishes a release image exactly once, from ci.yaml's
# release-image job. There is no way to ask for it again, so when an image is
# published wrong there is nothing to re-run — v7.2.0 was built from the wrong
# commit and could only be corrected by hand. This is that missing operation.
#
# retag (default) — a registry-side manifest copy, so the release image is
#   bit-identical to the tested artifact. Rebuilding instead is not reproducible: the
#   v7.2.0 repair produced sha256:0fcbc1e7 from the same commit that had already
#   yielded sha256:e3082db0, leaving :v7.2.0 and :sha-44230d8 as different images.
#
# rebuild — fall back to building from the tag, for when no sha- image survives
#   for that commit (pruned, or predating this pipeline).
name: release-republish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to repair (e.g. v8.0.0)
        required: true
        type: string
      mode:
        description: retag the CI-built image (preferred), or rebuild from the tag
        required: true
        default: retag
        type: choice
        options:
          - retag
          - rebuild

concurrency:
  group: release-republish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retag:
    name: retag ${{ inputs.tag }}
    if: ${{ inputs.mode == 'retag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Resolve the tag to its commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.sha')
          type=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq '.object.type')
          if [ "${type}" = "tag" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=sha-${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "${TAG} -> ${sha} (${sha:0:7})"

      # GITHUB_TOKEN, as before this pipeline: pushing to and pulling from this repo's own GHCR
      # namespace needs no App token. The template's scoped App tokens are a follow-up.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is distroless (no node, no shell, no package.json), so the check reads the
      # OCI revision label docker/metadata-action stamps at build time: the image must have
      # been built from the commit the tag points at.
      - name: Verify the source image was built from the tagged commit
        env:
          SRC: ${{ env.IMAGE }}:${{ steps.commit.outputs.short }}
          WANT: ${{ steps.commit.outputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "source image: ${SRC}"
          docker pull -q "${SRC}"
          have=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${SRC}")
          echo "tag commit:     ${WANT}"
          echo "image revision: ${have}"
          [ "${WANT}" = "${have}" ] || { echo "::error::${SRC} was built from ${have}, refusing to retag it as ${TAG}"; exit 1; }

      - name: Point the semver tags at that image
        id: out
        env:
          SRC: ${{ env.IMAGE }}:${{ steps.commit.outputs.short }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # Refuse prereleases: metadata-action never produced :v1 / :v1.2 for
          # them, so moving those tags here would clobber the last stable release.
          case "${ver}" in
            *-*|*+*) echo "::error::${TAG} is a prerelease; ci-build publishes no moving tags for it"; exit 1 ;;
          esac
          case "${ver}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::${TAG} is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major="${ver%%.*}"
          minor="${ver%.*}"
          docker buildx imagetools create \
            -t "${IMAGE}:v${ver}" \
            -t "${IMAGE}:v${minor}" \
            -t "${IMAGE}:v${major}" \
            "${SRC}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:v${ver}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "v${ver}, v${minor}, v${major} -> ${digest}"

  rebuild:
    name: rebuild ${{ inputs.tag }}
    if: ${{ inputs.mode == 'rebuild' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml
    with:
      version: ${{ inputs.tag }}
      ref: ${{ inputs.tag }}

  smoke:
    needs: [retag, rebuild]
    if: ${{ !cancelled() && (needs.retag.result == 'success' || needs.rebuild.result == 'success') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-smoke.yml
    with:
      image: ${{ needs.retag.outputs.image || needs.rebuild.outputs.image }}
