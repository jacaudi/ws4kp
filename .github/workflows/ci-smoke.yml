# Stage d — thin harness: runs `task smoke` with IMAGE set; the repo owns what smoke means. Rationale: github-actions-align/templates/README.md#ci-smokeyml
#
# What smoke means for ws4kp lives in taskfile.yml (task smoke): local endpoints only, no
# upstream, so it is deterministic, and it runs the same on a laptop. Image vulnerability
# scanning is intentionally NOT here — it is on hold until a scanner is chosen.
name: ci-smoke

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to smoke test (digest-pinned)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GITHUB_TOKEN, as before this pipeline: pushing to and pulling from this repo's own GHCR
      # namespace needs no App token. The template's scoped App tokens are a follow-up.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run task smoke
        env:
          IMAGE: ${{ inputs.image }}
        run: task smoke
