# Stage d — artifact testing (smoke). Boots the freshly built image and asserts
# it serves. Local endpoints only (no upstream), so it is deterministic.
# Image vulnerability scanning is intentionally NOT here — deferred into the
# scanning (b) discussion (see the design doc).
name: ci-smoke

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to smoke test (digest-pinned)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: run image + probe endpoints
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name ws4kp -p 8080:8080 "${{ inputs.image }}"
          echo "Waiting for the container on :8080..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then echo "container failed to serve"; docker logs ws4kp; exit 1; fi
            sleep 2
          done
          # Each probe fails the job on anything but 200; an echo around curl would not.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200 || { echo "FAIL: http://localhost:8080/"; exit 1; }
          echo "GET / -> 200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/playlist.json)" = 200 || { echo "FAIL: http://localhost:8080/playlist.json"; exit 1; }
          echo "GET /playlist.json -> 200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/data/stations.json)" = 200 || { echo "FAIL: http://localhost:8080/data/stations.json"; exit 1; }
          echo "GET /data/stations.json -> 200"
          # media.mjs tells a static deployment's 404 from a failure by this header.
          curl -fsS -D - -o /dev/null http://localhost:8080/ | tr -d '\r' | grep -ix 'x-weatherstar: true' >/dev/null \
            || { echo "X-Weatherstar: true missing on /"; exit 1; }
          echo "X-Weatherstar on / -> true"
          # The index carries the server flag, so the browser routes through the proxies.
          curl -fsS http://localhost:8080/ | grep -F 'WS4KP_SERVER_AVAILABLE = true' >/dev/null \
            || { echo "server flag missing from /"; exit 1; }
          echo "GET / carries WS4KP_SERVER_AVAILABLE = true"
          # The image's own HEALTHCHECK command; the image has no shell, so it runs directly.
          docker exec ws4kp /app/ws4kp healthcheck
          echo "docker exec ws4kp /app/ws4kp healthcheck -> exit 0"

      - name: Container logs + teardown
        if: always()
        run: |
          docker logs ws4kp || true
          docker rm -f ws4kp || true
